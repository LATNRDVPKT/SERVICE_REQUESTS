{% extends "base.html" %}
{% block title %}Log in — Service Requests{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="login-box">
        <h2>Service Requests — Log in</h2>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="field-error" style="margin-bottom:10px;">Incorrect username or password.</div>
            {% endif %}
            <div class="field" style="margin-bottom:10px;">
                <label for="id_username">Username</label>
                {{ form.username }}
            </div>
            <div class="field" style="margin-bottom:14px;">
                <label for="id_password">Password</label>
                {{ form.password }}
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
