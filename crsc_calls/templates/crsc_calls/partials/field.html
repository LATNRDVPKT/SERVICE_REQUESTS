<div class="field {% if field.errors %}has-error{% endif %}">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %}<span class="required-star">*</span>{% endif %}
        {% if field.name == "follow_up_remark" or field.name == "follow_up_comment" or field.name == "follow_up_engineer" %}
            {% if field.field.disabled %}<span class="locked-badge">Locked</span>{% endif %}
        {% endif %}
    </label>
    {{ field }}
    {% for error in field.errors %}
        <div class="field-error">{{ error }}</div>
    {% endfor %}
</div>
